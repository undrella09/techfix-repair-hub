{% extends "base.html" %}
{% block title %}Register | TechFix Repair Hub{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-lg-5">
                    <h1 class="h3 fw-bold mb-2">Create your account</h1>
                    <p class="text-muted mb-4">Submit repair requests and track their status.</p>
                    <form method="post" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="name">Full Name</label>
                            <input class="form-control" type="text" id="name" name="name"
                                   value="{{ name|default('') }}" maxlength="120" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-control" type="email" id="email" name="email"
                                   value="{{ email|default('') }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" type="password" id="password" name="password"
                                   minlength="8" required>
                            <div class="form-text">Use at least 8 characters.</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="confirm_password">Confirm Password</label>
                            <input class="form-control" type="password" id="confirm_password"
                                   name="confirm_password" minlength="8" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Register</button>
                    </form>
                    <p class="small text-muted mt-4 mb-0 text-center">
                        Already registered? <a href="{{ url_for('auth.login') }}">Login here</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
